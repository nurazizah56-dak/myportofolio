{% extends 'base.html' %}
{% block meta %}
    <title>{{ name }} - Portofolio</title>
{% endblock meta %}
{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/azizah.jpg" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/nurazizah56-dak/" class="social-link">GitHub</a>
                    <a href="https://id.linkedin.com/in/nur-azizah-218j/" class="social-link">LinkedIn</a>
                    <a href="mailto:nur15azizah67@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
