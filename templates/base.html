{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_education' %}">Education</a>
                <a href="{% url 'main:show_skills' %}">Skills</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_achievements' %}">Achievements</a>
                <a href="{% url 'main:show_certifications' %}">Certifications</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Faculty of Computer Science, Universitas Indonesia.</p>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>
    <script>
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

    <script>
        document.addEventListener("submit", async function (e) {
            const form = e.target;
            if (!form.classList.contains("delete-form")) return;

            e.preventDefault();

            const url = form.dataset.deleteUrl;
            const errorEl = form.querySelector(".delete-error-message");
            const passwordInput = form.querySelector(".delete-password-input");
            const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;

            const formData = new FormData(form);

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "X-CSRFToken": csrfToken },
                    body: formData,
                });
                const data = await response.json();

                if (data.success) {
                    const modal = form.closest(".project-delete-modal");
                    const cardId = modal.dataset.experienceCard;
                    const card = document.getElementById(cardId);
                    if (card) card.remove();
                    modal.hidePopover();
                } else {
                    errorEl.textContent = data.message;
                    errorEl.style.display = "block";
                    passwordInput.value = "";
                    passwordInput.focus();
                }
            } catch (err) {
                errorEl.textContent = "An error occurred, please try again.";
                errorEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
