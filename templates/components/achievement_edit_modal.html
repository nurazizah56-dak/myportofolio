<div id="edit-achievement-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="edit-achievement-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="edit-achievement-modal" popovertargetaction="hide" aria-label="Close edit achievement form"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="edit-achievement-modal" popovertargetaction="hide" aria-label="Close edit achievement form">&times;</button>
        <h2 id="edit-achievement-modal-title">Edit Achievement</h2>
        <form id="edit-achievement-form" class="project-form">
            {% csrf_token %}
            <input type="hidden" id="edit-achievement-id" name="id">
            <div class="form-group">
                <label for="edit-achievement-title">Title</label>
                <input type="text" id="edit-achievement-title" name="title" class="form-control" required placeholder="1st Place National Hackathon">
            </div>
            <div class="form-group">
                <label for="edit-achievement-description">Description</label>
                <textarea id="edit-achievement-description" name="description" class="form-control" rows="3" required placeholder="Describe the achievement"></textarea>
            </div>
            <div class="form-group">
                <label for="edit-achievement-year">Year</label>
                <input type="number" id="edit-achievement-year" name="year" class="form-control" required placeholder="2026">
            </div>
            <div class="form-group">
                <label for="edit-achievement-category">Category</label>
                <select id="edit-achievement-category" name="category" class="form-control" required>
                    <option value="academic">Academic</option>
                    <option value="non_academic">Non Academic</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edit-achievement-icon">Icon (emoji)</label>
                <input type="text" id="edit-achievement-icon" name="icon" class="form-control" placeholder="🏆">
            </div>
            <div class="form-group">
                <label for="edit-achievement-image">Certificate Image Path (optional)</label>
                <input type="text" id="edit-achievement-image" name="image" class="form-control" placeholder="/static/images/cert.png">
            </div>
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="edit-achievement-modal" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
