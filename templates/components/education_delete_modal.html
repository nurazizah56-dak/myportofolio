<button type="button"
        class="button button-danger"
        popovertarget="delete-education-{{ edu.id }}"
        aria-label="Delete {{ edu.institution_name }}"
        title="Delete education history">
    Delete
</button>

<div id="delete-education-{{ edu.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ edu.id }}"
     data-experience-card="education-card-{{ edu.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-education-{{ edu.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-education-{{ edu.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-education-title-{{ edu.id }}">Delete Education Entry?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ edu.institution_name }}</strong>?
        </p>
        <form class="delete-form" data-delete-url="{% url 'main:delete_education' edu.id %}">
            {% csrf_token %}
            <input type="password" name="password" placeholder="Secret key" required
                   class="delete-password-input">
            <p class="delete-error-message" style="display:none;"></p>
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-education-{{ edu.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
